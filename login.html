<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça login em ://pbworks.com</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #5c964e;
            margin: 0;
            padding: 0;
            font-size: 13px;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background-color: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 40px 50px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            box-sizing: border-box;
            display: flex;
            gap: 40px;
        }

        .form-section {
            flex: 2;
        }

        .form-section h2 {
            font-size: 24px;
            font-weight: normal;
            margin: 0 0 5px 0;
            color: #000000;
        }

        .form-section .workspace-url {
            font-size: 24px;
            font-weight: bold;
            color: #444444;
            margin-bottom: 20px;
        }

        .divider {
            border-top: 1px solid #e0e0e0;
            margin-bottom: 25px;
        }

        .license-text {
            font-size: 12px;
            color: #666666;
            margin-bottom: 30px;
        }

        .license-text a {
            color: #0066cc;
            text-decoration: none;
        }

        .form-table {
            width: 100%;
            margin-bottom: 15px;
        }

        .form-table td {
            padding: 8px 0;
            vertical-align: middle;
        }

        .form-table .label-cell {
            width: 110px;
            text-align: right;
            padding-right: 15px;
            font-weight: bold;
            color: #333333;
            font-size: 12px;
            line-height: 1.3;
        }

        .form-table input[type="text"], 
        .form-table input[type="password"] {
            width: 250px;
            padding: 4px;
            border: 1px solid #b5c7d3;
            font-size: 13px;
        }

        .checkbox-row {
            padding-left: 110px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .action-row {
            padding-left: 110px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-submit {
            background: #ededed;
            color: #000000;
            border: 1px solid #b5b5b5;
            padding: 4px 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-submit:hover {
            background: #e0e0e0;
        }

        .action-row a {
            color: #0066cc;
            text-decoration: none;
        }

        .sidebar-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .gray-box {
            background-color: #f5f5f5;
            border: 1px solid #dddddd;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }

        .gray-box p {
            margin: 0 0 10px 0;
            font-size: 11px;
            color: #666666;
        }

        .btn-sidebar {
            background: #ffffff;
            color: #000000;
            border: 1px solid #b5b5b5;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .sidebar-help-text {
            font-size: 11px;
            color: #666666;
            line-height: 1.4;
        }

        .sidebar-help-text a {
            color: #0066cc;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="form-section">
            <h2>Log in to</h2>
            <div class="workspace-url">://pbworks.com</div>
            
            <div class="divider"></div>
            
            <div class="license-text">
                This workspace is licensed for non-commercial use only. <a href="#">Learn More</a>
            </div>

            <form action="/" method="POST">
                <table class="form-table">
                    <tr>
                        <td class="label-cell">Email/username</td>
                        <td><input type="text" name="email" required autocomplete="off"></td>
                    </tr>
                    <tr>
                        <td class="label-cell">Password</td>
                        <td><input type="password" name="password" required></td>
                    </tr>
                </table>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember" name="remember" checked>
                    <label for="remember">Remember me</label>
                </div>

                <div class="action-row">
                    <button type="submit" class="btn-submit">Log in</button>
                    <a href="#">Forgot your password?</a>
                </div>
            </form>
        </div>

        <div class="sidebar-section">
            <div class="gray-box">
                <p>Not a member?</p>
                <button class="btn-sidebar">Request access</button>
            </div>
            <div class="sidebar-help-text">
                To get in touch, <a href="#">contact the workspace owner.</a>
            </div>
        </div>
    </div>

</body>
</html>
